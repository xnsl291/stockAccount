services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: accountSystem
      MYSQL_USER: account
      MYSQL_PASSWORD: account
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql-data:
