# E2E 전용 MySQL·Redis. 개발용(저장소 루트 docker-compose.yml, 3306·6379, 영속 볼륨)과 포트·데이터를 나눔
# MySQL 데이터는 볼륨 없이 메모리(tmpfs)에 둬서 컨테이너를 내리면 사라짐. 테스트가 Redis 키(SMS_SEND_IP:*)를 지우는 것도 여기서만 함
name: stockaccount-e2e

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: accountSystem
      MYSQL_USER: account
      MYSQL_PASSWORD: account
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3317:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uaccount", "-paccount"]
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
