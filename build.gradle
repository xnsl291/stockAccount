plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'zb'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// 스키마 변경을 SQL 파일로 관리. 버전은 Spring Boot가 관리하는 값을 따르고, 8.x부터 MySQL 지원이 별도 모듈임
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'

	// 지표 내보내기. Prometheus가 /actuator/prometheus를 긁어 감
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'


	implementation 'org.apache.commons:commons-lang3:3.12.0'  // RandomStringUtils
	implementation 'net.nurigo:sdk:4.2.7' // coolSMS

	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testImplementation 'org.springframework.boot:spring-boot-restclient'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	// 모듈 사이 import 규칙을 테스트로 고정. 1.5.1은 Java 8 바이트코드로 배포되어 Java 17에서 돎
	testImplementation 'com.tngtech.archunit:archunit:1.5.1'
}

tasks.named('test') {
	useJUnitPlatform()
}
